version: '3.8'

services:
  # Main Control Dashboard
  dashboard:
    image: node:20-alpine
    container_name: vnc_dashboard
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: sh -c "npm install && npm start"
    networks:
      - vnc_net

  # Kasm Environment
  kasm-desktop:
    image: kasmweb/desktop:1.15.0
    container_name: kasm_desktop
    ports:
      - "6901:6901"
    environment:
      - VNC_PW=password123
    shm_size: '512m'
    networks:
      - vnc_net

  # Standalone noVNC + Chromium Environment
  novnc-browser:
    image: selenium/standalone-chromium:latest
    container_name: novnc_browser
    ports:
      - "7900:7900"
    shm_size: '2gb'
    networks:
      - vnc_net

networks:
  vnc_net:
    driver: bridge
